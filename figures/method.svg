<svg xmlns="http://www.w3.org/2000/svg" width="440" height="715" viewBox="0 0 440 715" role="img" aria-labelledby="title desc"><title id="title">从两种历史表示到24步预测</title><desc id="desc">连续历史保留变化顺序：过去168小时负荷＋观测标记：TimeXer编码 → 每个目标步的64维表示。同小时记录提供对应参照：前1—7天＋前2—12周，共18个槽位：每槽：负荷值、启用标记、观测标记。拼接两路信息：64维近期表示＋54维历史向量：118维 → 64维融合表示。按计量序列适配输出：近期基础预测＋历史融合修正：恢复量纲，负值在推理时归零。预测未来24个小时位置：每个小时产生一个负荷预测值：月初训练，随后逐日起报与评分</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="440" height="715" rx="5" fill="#fff"/><text x="22" y="34" font-size="22" fill="#292832" font-weight="700" text-anchor="start">从两种历史表示到24步预测</text><text x="22" y="64" font-size="15" fill="#706b79" font-weight="400" text-anchor="start">同一计量序列 · 所有输入均在起报前取得</text><rect x="22" y="90" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="118" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">1. 连续历史保留变化顺序</text><text x="38" y="146" font-size="17" fill="#292832" font-weight="400" text-anchor="start">过去168小时负荷＋观测标记</text><text x="38" y="170" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">TimeXer编码 → 每个目标步的64维表示</text><text x="220" y="209" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="215" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="243" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">2. 同小时记录提供对应参照</text><text x="38" y="271" font-size="17" fill="#292832" font-weight="400" text-anchor="start">前1—7天＋前2—12周，共18个槽位</text><text x="38" y="295" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">每槽：负荷值、启用标记、观测标记</text><text x="220" y="334" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="340" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="368" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">3. 拼接两路信息</text><text x="38" y="396" font-size="17" fill="#292832" font-weight="400" text-anchor="start">64维近期表示＋54维历史向量</text><text x="38" y="420" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">118维 → 64维融合表示</text><text x="220" y="459" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="465" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="493" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">4. 按计量序列适配输出</text><text x="38" y="521" font-size="17" fill="#292832" font-weight="400" text-anchor="start">近期基础预测＋历史融合修正</text><text x="38" y="545" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">恢复量纲，负值在推理时归零</text><text x="220" y="584" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="590" width="396" height="98" rx="5" fill="#edf7f1"/><text x="38" y="618" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">5. 预测未来24个小时位置</text><text x="38" y="646" font-size="17" fill="#292832" font-weight="400" text-anchor="start">每个小时产生一个负荷预测值</text><text x="38" y="670" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">月初训练，随后逐日起报与评分</text></svg>