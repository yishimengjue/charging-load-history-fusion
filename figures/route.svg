<svg xmlns="http://www.w3.org/2000/svg" width="440" height="715" viewBox="0 0 440 715" role="img" aria-labelledby="title desc"><title id="title">研究路线与当前选择</title><desc id="desc">直接预测与会话分解：直接预测作为起点；尝试先分解再重建：分解误差会传递，未成为当前输出路径。保留数据与历史统计：保留已观测标签；构建同类时段统计：成为后续模型的数据准备与参照。序列网络与预测组合：TimeXer读取近期序列并融合历史摘要：旧树与神经组合：OP一至三月4.528269 kW。逐条历史输入与归因：区分近7天重组、增加远期记录：当前近远期网络：OP一至三月4.565178 kW。跨数据与朴素方法比较：LCL误差下降，SOFIE误差上升：保留差异；下一项周期模型尚未运行</desc><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="440" height="715" rx="5" fill="#fff"/><text x="22" y="34" font-size="22" fill="#292832" font-weight="700" text-anchor="start">研究路线与当前选择</text><text x="22" y="64" font-size="15" fill="#706b79" font-weight="400" text-anchor="start">箭头表示研究推进，不表示收益逐项叠加</text><rect x="22" y="90" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="118" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">1. 直接预测与会话分解</text><text x="38" y="146" font-size="17" fill="#292832" font-weight="400" text-anchor="start">直接预测作为起点；尝试先分解再重建</text><text x="38" y="170" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">分解误差会传递，未成为当前输出路径</text><text x="220" y="209" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="215" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="243" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">2. 保留数据与历史统计</text><text x="38" y="271" font-size="17" fill="#292832" font-weight="400" text-anchor="start">保留已观测标签；构建同类时段统计</text><text x="38" y="295" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">成为后续模型的数据准备与参照</text><text x="220" y="334" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="340" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="368" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">3. 序列网络与预测组合</text><text x="38" y="396" font-size="17" fill="#292832" font-weight="400" text-anchor="start">TimeXer读取近期序列并融合历史摘要</text><text x="38" y="420" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">旧树与神经组合：OP一至三月4.528269 kW</text><text x="220" y="459" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="465" width="396" height="98" rx="5" fill="#f3f0fc"/><text x="38" y="493" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">4. 逐条历史输入与归因</text><text x="38" y="521" font-size="17" fill="#292832" font-weight="400" text-anchor="start">区分近7天重组、增加远期记录</text><text x="38" y="545" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">当前近远期网络：OP一至三月4.565178 kW</text><text x="220" y="584" font-size="22" fill="#706b79" font-weight="400" text-anchor="middle">↓</text><rect x="22" y="590" width="396" height="98" rx="5" fill="#edf7f1"/><text x="38" y="618" font-size="20" fill="#6c4ed9" font-weight="700" text-anchor="start">5. 跨数据与朴素方法比较</text><text x="38" y="646" font-size="17" fill="#292832" font-weight="400" text-anchor="start">LCL误差下降，SOFIE误差上升</text><text x="38" y="670" font-size="16" fill="#706b79" font-weight="400" text-anchor="start">保留差异；下一项周期模型尚未运行</text></svg>